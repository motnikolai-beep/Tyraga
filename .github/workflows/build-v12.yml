name: Build v12 New Faces
on:
  workflow_dispatch:
  push:
    paths:
      - 'build_v12.py'
      - '.github/workflows/build-v12.yml'
      - 'первая половина/**'
      - 'art_4k/**'
      - 'assets/**'
      - 'tests/**'
      - '*.py'
      - 'npcs.json'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10'
      - run: python build_v12.py
      - uses: actions/upload-artifact@v4
        with:
          name: TYURYAGA-v12-FULL
          path: dist/TYURYAGA_v12_FULL.zip
          if-no-files-found: error
      # The archive is uploaded first, so a failing test never hides the build itself.
      - name: Tests of the sources
        run: python -m unittest discover -s tests
      - name: Tests of the built game
        run: python -m unittest discover -s tests
        working-directory: dist/Tyuryaga_v12
