name: Build v12 New Faces
on:
  workflow_dispatch:
  push:
    paths:
      - 'build_v12.py'
      - '.github/workflows/build-v12.yml'
      - 'первая половина/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10'
      - run: python build_v12.py
      - uses: actions/upload-artifact@v4
        with:
          name: TYURYAGA-v12-FULL
          path: dist/TYURYAGA_v12_FULL.zip
          if-no-files-found: error
