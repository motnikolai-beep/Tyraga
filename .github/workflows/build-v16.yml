name: Build v16 Interactive Environment
on:
  workflow_dispatch:
  push:
    paths:
      - 'build_v12.py'
      - 'build_v13.py'
      - 'build_v14.py'
      - 'build_v15.py'
      - 'build_v16.py'
      - 'hotspots16.py'
      - 'ИГРАТЬ_v16.md'
      - 'CHANGELOG_v16.md'
      - 'boss15.py'
      - 'life15.py'
      - 'story15.py'
      - 'ИГРАТЬ_v15.md'
      - 'CHANGELOG_v15.md'
      - 'mentor14.py'
      - 'ИГРАТЬ_v14.md'
      - 'CHANGELOG_v14.md'
      - 'ИГРАТЬ_v13.md'
      - 'CHANGELOG_v13.md'
      - '.github/workflows/build-v16.yml'
      - 'первая половина/**'
      - 'art_4k/**'
      - 'assets/**'
      - 'tests/**'
      - '*.py'
      - 'npcs.json'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10'
      - run: python build_v16.py
      - uses: actions/upload-artifact@v4
        with:
          name: TYURYAGA-v16-FULL
          path: dist/TYURYAGA_v16_FULL.zip
          if-no-files-found: error
      # The archive is uploaded first, so a failing test never hides the build itself.
      - name: Tests of the sources
        run: python -m unittest discover -s tests
      - name: Tests of the built game
        run: python -m unittest discover -s tests
        working-directory: dist/Tyuryaga_v16
